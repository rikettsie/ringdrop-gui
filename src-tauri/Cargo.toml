[package]
name = "ringdrop-gui"
version = "0.1.0"
description = "Desktop GUI for ringdrop, the ring-based P2P blob sharer"
authors = ["Enrico Fusto"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "ringdrop_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ringdrop = "0.12.0"

